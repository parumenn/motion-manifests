apiVersion: apps/v1
kind: Deployment
metadata:
  name: motion-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: motion-backend
  template:
    metadata:
      labels:
        app: motion-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/parumenn/motion-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "postgres-svc.default.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "motion"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: motion-secrets
                  key: db-password
            - name: DB_NAME
              value: "motion_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: motion-secrets
                  key: jwt-secret
            # 認証基盤（2026-11-16）: メール送信はマイボードと同一の Resend SMTP を
            # motion-secrets 経由で共有する。値は Secret にのみ置く（Git に書かない）
            - name: PUBLIC_BASE_URL
              value: "https://motion.parumenn.com"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: motion-secrets
                  key: smtp-host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: motion-secrets
                  key: smtp-port
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: motion-secrets
                  key: smtp-user
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: motion-secrets
                  key: smtp-pass
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: motion-secrets
                  key: mail-from
          volumeMounts:
            - mountPath: /app/uploads
              name: uploads-data
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: motion-backend-images-pvc # ← hostPathからPVCに変更
---
apiVersion: v1
kind: Service
metadata:
  name: motion-backend-svc
  namespace: default
spec:
  selector:
    app: motion-backend
  ports:
    - port: 3000
      targetPort: 3000
