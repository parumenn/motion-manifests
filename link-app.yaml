# ここにゃす リンクサイト（go.parumenn.com）
# サイト実ファイルは motion-manifests リポジトリの link/app/ に置き、
# git-sync サイドカーが定期取得して nginx が配信する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: link-nginx-conf
  namespace: default
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /git/linkcurrent/link/app;
      index index.html;
      location ~ ^/r/([A-Z][0-9]{2})$ {
        return 302 /#r/$1;
      }
      location / {
        try_files $uri $uri/ =404;
      }
      location /assets/ {
        expires 1h;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-app
  namespace: default
  labels:
    app: link-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: link-app
  template:
    metadata:
      labels:
        app: link-app
    spec:
      containers:
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.2.4
        args:
        - --repo=https://github.com/parumenn/motion-manifests
        - --ref=main
        - --root=/git
        - --link=linkcurrent
        - --period=120s
        - --max-failures=30
        volumeMounts:
        - name: content
          mountPath: /git
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: content
          mountPath: /git
          readOnly: true
        - name: conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: content
        emptyDir: {}
      - name: conf
        configMap:
          name: link-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: link-svc
  namespace: default
spec:
  selector:
    app: link-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
