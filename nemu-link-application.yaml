# ねむ リンクサイト専用 ArgoCD Application
# motion-app（path=.）がこのマニフェストを適用して nemu-link-site アプリを登録する（app-of-apps）。
# nemu-link-site は nemu-link/manifests/ 配下だけを管理する。認証バックエンドのみ。サイト実ファイルは link/app/nemu/（link-app の git-sync が配信）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nemu-link-site
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/parumenn/motion-manifests
    targetRevision: HEAD
    path: nemu-link/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
