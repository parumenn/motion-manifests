<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理ページログイン｜むぎ</title>
<style>
  :root { --brown:#5B4636; --sage:#7A8F6E; --line:#e5ded6; --bg:#fffdf9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; background:var(--bg); color:var(--brown); }
  .wrap { max-width:420px; margin:0 auto; padding:40px 16px 48px; }
  h1 { font-size:19px; margin-bottom:6px; }
  .sub { font-size:12px; opacity:.7; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 16px; box-shadow:0 4px 14px rgba(91,70,54,.06); }
  label { font-size:13px; font-weight:700; display:block; margin-bottom:8px; }
  input[type="password"] { width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--line); border-radius:10px; outline:none; background:var(--bg); color:var(--brown); }
  input[type="password"]:focus { border-color:var(--sage); }
  button { width:100%; margin-top:12px; background:var(--brown); color:#fff; font-weight:700; font-size:15px; border:none; padding:12px 14px; border-radius:999px; cursor:pointer; }
  button.passkey { background:var(--sage); }
  button:disabled { opacity:.45; cursor:default; }
  .divider { text-align:center; font-size:12px; opacity:.6; margin:16px 0 2px; }
  .msg { font-size:13px; margin-top:12px; min-height:18px; line-height:1.5; }
  .msg.error { color:#a33b3b; }
  .msg.notice { color:var(--brown); background:#f6efe6; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
</style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <h1>むぎ管理ページ</h1>
  <div class="sub">管理者ログイン</div>
  <div class="card">
    <form id="pwForm">
      <label for="pw">パスワード</label>
      <input type="password" id="pw" autocomplete="current-password">
      <button type="submit" id="pwBtn">パスワードでログイン</button>
    </form>
    <div class="divider">または</div>
    <button type="button" class="passkey" id="pkBtn">パスキーでログイン</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="admin-common.js?v=20261126-authsep"></script>
<script>
const msgEl = document.getElementById('msg');
const pwInput = document.getElementById('pw');
const pwBtn = document.getElementById('pwBtn');
const pkBtn = document.getElementById('pkBtn');
const params = new URLSearchParams(location.search);
const next = params.get('next') && params.get('next').startsWith('/') ? params.get('next') : '/admin.html';

function showMsg(text, cls) {
  msgEl.textContent = text;
  msgEl.className = 'msg' + (cls ? ' ' + cls : '');
}

(async () => {
  const { status, json } = await apiJson('/config');
  if (status === 200 && json && !json.password_set) {
    pwInput.disabled = true;
    pwBtn.disabled = true;
    showMsg('パスワード未設定です。サーバ側でパスワードハッシュが設定されるまで、パスワードログインは使えません。', 'notice');
  }
  if (!window.PublicKeyCredential) pkBtn.disabled = true;
})();

document.getElementById('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  showMsg('');
  pwBtn.disabled = true;
  const { status, json } = await apiJson('/login', 'POST', { password: pwInput.value });
  pwBtn.disabled = false;
  if (status === 200) { location.href = next; return; }
  if (status === 503) {
    showMsg('パスワード未設定です。サーバ側でパスワードハッシュが設定されるまで、パスワードログインは使えません。', 'notice');
    return;
  }
  showMsg((json && json.message) || 'ログインに失敗しました', 'error');
});

pkBtn.addEventListener('click', async () => {
  showMsg('');
  pkBtn.disabled = true;
  try {
    const opt = await apiJson('/passkeys/login/options', 'POST', {});
    if (opt.status !== 200) throw new Error('options');
    const cred = await navigator.credentials.get({ publicKey: prepareRequestOptions(opt.json) });
    if (!cred) throw new Error('cancelled');
    const ver = await apiJson('/passkeys/login/verify', 'POST', { response: serializeCredential(cred) });
    if (ver.status === 200) { location.href = next; return; }
    showMsg((ver.json && ver.json.message) || 'パスキーでのログインに失敗しました', 'error');
  } catch (e) {
    if (e && e.name === 'NotAllowedError') showMsg('パスキーの認証がキャンセルされました', 'error');
    else showMsg('パスキーでのログインに失敗しました', 'error');
  } finally {
    pkBtn.disabled = false;
  }
});
</script>
</body>
</html>
