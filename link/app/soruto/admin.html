<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>そると管理ページ</title>
<style>
:root { --brown:#5B4636; --sage:#7A8F6E; --line:#e5ded6; --bg:#fffdf9;}
* { box-sizing:border-box; margin:0; padding:0;}
body { font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; background:var(--bg); color:var(--brown);}
.wrap { max-width:560px; margin:0 auto; padding:20px 14px 48px;}
h1 { font-size:19px; margin-bottom:4px;}
.sub { font-size:12px; opacity:.7; margin-bottom:14px;}
.summary { display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:18px;}
.summary.num { font-size:15px; font-weight:700;}
.summary.num b { font-size:19px;}
button.copy { background:var(--sage); color:#fff; font-weight:700; font-size:13px; border:none; padding:9px 14px; border-radius:999px; cursor:pointer;}
button.copy:active { opacity:.75;}
button.copy.small { background:var(--brown); font-size:12px; padding:7px 12px;}
.card { position:relative; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:16px; box-shadow:0 4px 14px rgba(91,70,54,.06);}
.card.theme { font-size:16px; font-weight:700; margin:2px 90px 4px 0; line-height:1.4;}
.card.meta { font-size:12px; opacity:.8; margin-bottom:8px;}
.cbadge { position:absolute; top:12px; right:12px; font-size:12px; font-weight:700; color:#fff; padding:4px 11px; border-radius:999px; white-space:nowrap;}
.cbadge.today { background:#c2603e;}
.cbadge.future { background:var(--sage);}
.cbadge.overdue { background:#a33b3b;}
.cbadge.done { background:#b9ab9c;}
  .cbadge.idea { background:#8a7a9e;}
  .placeholder { display:flex; align-items:center; justify-content:center; width:62%; max-width:280px; aspect-ratio:4/5; background:#f3ede4; border:1px dashed var(--sage); border-radius:12px; color:var(--brown); font-weight:700; font-size:15px; text-align:center; padding:16px; line-height:1.5; margin-bottom:8px;}
.slides { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px;}
.slides img { width:62%; max-width:280px; aspect-ratio:4/5; object-fit:cover; border-radius:12px; flex:none; display:block;}
.pids { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px;}
.pids.badge { display:inline-block; background:var(--brown); color:#fff; font-weight:700; font-size:12px; padding:2px 9px; border-radius:999px; letter-spacing:.08em;}
.fb { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}
.fb label { font-size:12px; font-weight:700; display:block; margin-bottom:6px;}
.fb textarea { width:100%; min-height:64px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13px; font-family:inherit; color:var(--brown); background:var(--bg); resize:vertical; outline:none;}
.fb textarea:focus { border-color:var(--sage);}
.fb.row { display:flex; justify-content:space-between; align-items:center; margin-top:7px;}
.fb.saved { font-size:11px; opacity:.6;}
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--brown); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity.25s ease, transform.25s ease;}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0);}
.empty { font-size:13px; opacity:.7; padding:8px 4px;}
  .rowbtns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .rowbtns input { flex:1; min-width:140px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-size:13px; font-family:inherit; color:var(--brown); background:var(--bg); outline:none; }
  .rowbtns input:focus { border-color:var(--sage); }
  button.copy.danger { background:#a33b3b; }
  .msg { font-size:12px; margin-top:8px; min-height:15px; line-height:1.5; }
  .msg.error { color:#a33b3b; }
  .pkrow { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .pkrow .dates { font-size:11px; opacity:.65; }
footer { margin-top:30px; font-size:11px; opacity:.6; text-align:center; line-height:1.6;}
</style>
  <link rel="icon" href="/soruto/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/soruto/favicon.png">
  <link rel="apple-touch-icon" href="/soruto/apple-touch-icon.png">
</head>
<body>
<div class="wrap" style="padding-bottom:0">
  <div class="card">
    <div class="theme" style="margin-right:0">管理者メニュー</div>
    <div class="meta" id="authInfo">ログイン情報を確認中…</div>
    <div class="rowbtns">
      <button type="button" class="copy small" id="logoutBtn">ログアウト</button>
    </div>
    <div class="fb">
      <label>パスキー管理</label>
      <div id="pkList"><span class="saved">読み込み中…</span></div>
      <div class="rowbtns">
        <input type="text" id="pkName" placeholder="パスキーの名前（例：iPhone）" maxlength="50">
        <button type="button" class="copy small" id="pkAdd">パスキーを追加</button>
      </div>
      <div class="msg" id="pkMsg"></div>
    </div>
    <div class="fb" id="stepupBox" hidden>
      <label>再認証が必要です（パスキーの追加・削除の前に確認します）</label>
      <div class="rowbtns">
        <input type="password" id="stepupPw" placeholder="パスワード" autocomplete="current-password">
        <button type="button" class="copy small" id="stepupPwBtn">パスワードで再認証</button>
        <button type="button" class="copy small" id="stepupPkBtn">パスキーで再認証</button>
      </div>
      <div class="msg" id="stepupMsg"></div>
    </div>
  </div>
</div>
<div class="wrap" id="app">読み込み中…</div>
<div class="toast" id="toast">コピーしました</div>
<script>
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(msg) {
toastEl.textContent = msg;
toastEl.classList.add('show');
if (toastTimer) clearTimeout(toastTimer);
toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

async function copyText(text) {
try {
await navigator.clipboard.writeText(text);
return true;
} catch (e) {
const ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.select();
let ok = false;
try { ok = document.execCommand('copy');} catch (_) {}
document.body.removeChild(ta);
return ok;
}
}

function parseLocalDate(s) {
const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
if (!m) return null;
return new Date(+m[1], +m[2] - 1, +m[3]);
}

function todayLocal() {
const t = new Date();
t.setHours(0, 0, 0, 0);
return t;
}

// 投稿の公開状態とバッジを決める
// status: 'published'=投稿済み / 'scheduled'=投稿予定(制作済み) / 'idea'=企画段階
// status が無い既存データは date が今日以前なら投稿済み、未来日付なら未投稿として扱う
function resolvePost(post, today) {
const d = parseLocalDate(post.date);
const diff = d? Math.round((d - today) / 86400000): null;
const isIdea = post.status === 'idea';
let published;
if (post.status === 'published') published = true;
else if (post.status === 'scheduled' || isIdea) published = false;
else published = diff === null? true: diff <= 0;
let badge;
if (published) badge = { text: '投稿済み', cls: 'done'};
else if (isIdea) {
let text = '企画中';
if (diff === 0) text += '・今日';
else if (diff!== null && diff > 0) text += `・あと${diff}日`;
else if (diff!== null && diff < 0) text += '・日付経過';
badge = { text, cls: 'idea'};
}
else if (diff === 0) badge = { text: '今日', cls: 'today'};
else if (diff!== null && diff > 0) badge = { text: `あと${diff}日`, cls: 'future'};
else badge = { text: '未投稿（日付経過）', cls: 'overdue'};
return { published, isIdea, diff, badge, dateObj: d};
}

const ver = src => (window.ADMIN_DATA && window.ADMIN_DATA.assets_version && src && src.startsWith('assets/')) ? src + '?v=' + window.ADMIN_DATA.assets_version : src;
const fbKey = postId => 'adminfb:soruto:' + postId;
const fbText = post => `${post.post_id}（${post.theme}）：${(localStorage.getItem(fbKey(post.post_id)) || '').trim()}`;

function cardHtml(post, info) {
const dateLabel = post.date? post.date.replace(/-/g, '/'): '未定';
const kind = info.published? '投稿日': '投稿予定日';
const slidesHtml = post.images && post.images.length
? `<div class="slides">${post.images.map(src => `<img src="${ver(src)}" alt="" loading="lazy">`).join('')}</div>`
: `<div class="placeholder"><span>${post.theme}</span></div>`;
return `<div class="card" data-post-id="${post.post_id}">
<span class="cbadge ${info.badge.cls}">${info.badge.text}</span>
<div class="theme">${post.theme}</div>
<div class="meta">${kind}：${dateLabel} ／ ${post.post_id}</div>
${slidesHtml}
<div class="pids">${(post.product_ids || []).map(id => `<span class="badge">${id}</span>`).join('')}</div>
<div class="fb">
<label>フィードバック（この端末に自動保存）</label>
<textarea data-fb="${post.post_id}" placeholder="画像の直してほしい点など"></textarea>
<div class="row">
<span class="saved" data-saved="${post.post_id}"></span>
<button type="button" class="copy small" data-copy="${post.post_id}">このFBをコピー</button>
</div>
</div>
</div>`;
}

function render(DATA) {
const today = todayLocal();
const items = DATA.posts.map(p => ({ post: p, info: resolvePost(p, today)}));
const scheduled = items.filter(x =>!x.info.published)
.sort((a, b) => (a.info.dateObj || new Date(8640000000000000)) - (b.info.dateObj || new Date(8640000000000000)));
const published = items.filter(x => x.info.published)
.sort((a, b) => (b.info.dateObj || new Date(0)) - (a.info.dateObj || new Date(0)));
const ordered = [...scheduled,...published];
const ideaCount = scheduled.filter(x => x.info.isIdea).length;

app.innerHTML = `
<h1>そると管理ページ</h1>
<div class="sub">投稿ストックの確認と画像フィードバック用（このページは公開ページからリンクされていません）</div>
<div class="summary">
<span class="num">投稿済み <b>${published.length}</b> 件</span>
<span class="num">ストック（未投稿）<b>${scheduled.length}</b> 件（うち企画中 <b>${ideaCount}</b> 件）</span>
<span style="flex:1"></span>
<button type="button" class="copy" id="copyAll">FBをまとめてコピー</button>
</div>
${ordered.length? ordered.map(x => cardHtml(x.post, x.info)).join(''): '<div class="empty">投稿データがありません。</div>'}
<footer>FBはこの端末のブラウザに保存されます。別の端末では共有されません。</footer>`;

// FBの復元と自動保存
document.querySelectorAll('textarea[data-fb]').forEach(ta => {
const pid = ta.getAttribute('data-fb');
ta.value = localStorage.getItem(fbKey(pid)) || '';
const savedEl = document.querySelector(`[data-saved="${CSS.escape(pid)}"]`);
ta.addEventListener('input', () => {
localStorage.setItem(fbKey(pid), ta.value);
if (savedEl) savedEl.textContent = '保存しました';
});
});

// 個別コピー
document.querySelectorAll('button[data-copy]').forEach(btn => {
btn.addEventListener('click', async () => {
const pid = btn.getAttribute('data-copy');
const post = DATA.posts.find(p => p.post_id === pid);
if (!post) return;
if (!(localStorage.getItem(fbKey(pid)) || '').trim()) { showToast('FBが未入力です'); return;}
showToast(await copyText(fbText(post))? 'コピーしました': 'コピーに失敗しました');
});
});

// まとめてコピー
document.getElementById('copyAll').addEventListener('click', async () => {
const lines = ordered.map(x => x.post)
.filter(p => (localStorage.getItem(fbKey(p.post_id)) || '').trim())
.map(fbText);
if (!lines.length) { showToast('FBが未入力です'); return;}
showToast(await copyText(lines.join('\n'))? `${lines.length}件コピーしました`: 'コピーに失敗しました');
});
}

fetch('data.json', { cache: 'no-store' }).then(r => r.json()).then(d => { window.ADMIN_DATA = d; render(d); })
.catch(() => { app.innerHTML = '<div class="empty">data.json の読み込みに失敗しました。</div>';});
</script>
<script src="admin-common.js?v=20261127-soruto1"></script>
<script>
// ---- 管理者メニュー（認証・パスキー管理） ----
const authInfo = document.getElementById('authInfo');
const pkList = document.getElementById('pkList');
const pkMsg = document.getElementById('pkMsg');
const stepupBox = document.getElementById('stepupBox');
const stepupMsg = document.getElementById('stepupMsg');
let pendingAction = null;

function setMsg(el, text, isError) {
  el.textContent = text || '';
  el.className = 'msg' + (isError ? ' error' : '');
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

async function loadPasskeys() {
  const { status, json } = await apiJson('/passkeys');
  if (status !== 200 || !Array.isArray(json)) {
    pkList.innerHTML = '<span class="saved">読み込みに失敗しました</span>';
    return;
  }
  if (!json.length) {
    pkList.innerHTML = '<span class="saved">登録済みパスキーはありません。パスワードでログイン中に追加できます。</span>';
    return;
  }
  pkList.innerHTML = '';
  for (const pk of json) {
    const row = document.createElement('div');
    row.className = 'pkrow';
    const left = document.createElement('div');
    const nameDiv = document.createElement('div');
    nameDiv.textContent = pk.name || 'パスキー';
    const dates = document.createElement('div');
    dates.className = 'dates';
    dates.textContent = `登録：${fmtDate(pk.created_at)} ／ 最終使用：${fmtDate(pk.last_used_at)}`;
    left.appendChild(nameDiv);
    left.appendChild(dates);
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'copy small danger';
    del.textContent = '削除';
    del.addEventListener('click', () => withStepUp(() => doDeletePasskey(pk.credential_id)));
    row.appendChild(left);
    row.appendChild(del);
    pkList.appendChild(row);
  }
}

async function loadAuthInfo() {
  const { status, json } = await apiJson('/me', 'POST', {});
  if (status !== 200) {
    authInfo.innerHTML = 'セッションが確認できません。<a href="/soruto/admin-login.html">ログイン画面へ</a>';
    return;
  }
  authInfo.textContent = `ログイン中（方式：${json.auth_method === 'passkey' ? 'パスキー' : 'パスワード'}）`;
  loadPasskeys();
}

async function withStepUp(action) {
  const me = await apiJson('/me', 'POST', {});
  if (me.status === 200 && me.json.step_up_fresh) { action(); return; }
  pendingAction = action;
  stepupBox.hidden = false;
  setMsg(stepupMsg, '再認証が完了すると、そのまま操作が続行されます。', false);
  stepupBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function runPending() {
  stepupBox.hidden = true;
  const action = pendingAction;
  pendingAction = null;
  if (action) action();
}

async function doRegisterPasskey() {
  setMsg(pkMsg, '', false);
  const name = document.getElementById('pkName').value.trim();
  try {
    const opt = await apiJson('/passkeys/register/options', 'POST', {});
    if (opt.status === 403) { withStepUp(doRegisterPasskey); return; }
    if (opt.status !== 200) { setMsg(pkMsg, '登録の開始に失敗しました', true); return; }
    const cred = await navigator.credentials.create({ publicKey: prepareCreationOptions(opt.json) });
    if (!cred) { setMsg(pkMsg, 'パスキーの作成がキャンセルされました', true); return; }
    const ver = await apiJson('/passkeys/register/verify', 'POST', { response: serializeCredential(cred), name });
    if (ver.status === 200) {
      setMsg(pkMsg, 'パスキーを登録しました', false);
      document.getElementById('pkName').value = '';
      loadPasskeys();
    } else if (ver.status === 403) {
      withStepUp(doRegisterPasskey);
    } else {
      setMsg(pkMsg, (ver.json && ver.json.message) || 'パスキーの登録に失敗しました', true);
    }
  } catch (e) {
    console.error('doRegisterPasskey', e);
    if (e && e.name === 'InvalidStateError') {
      setMsg(pkMsg, 'このブラウザ／アカウントには登録済みのパスキーがあるため追加できませんでした。登録済みのパスキーでログインできます', true);
    } else {
      setMsg(pkMsg, `パスキーの登録に失敗しました（${(e && e.name) || 'Error'}）`, true);
    }
  }
}
async function doDeletePasskey(credentialId) {
  const { status, json } = await apiJson('/passkeys/' + encodeURIComponent(credentialId), 'DELETE');
  if (status === 200) {
    setMsg(pkMsg, 'パスキーを削除しました', false);
    loadPasskeys();
  } else if (status === 403) {
    withStepUp(() => doDeletePasskey(credentialId));
  } else {
    setMsg(pkMsg, (json && json.message) || '削除に失敗しました', true);
  }
}

document.getElementById('pkAdd').addEventListener('click', () => withStepUp(doRegisterPasskey));
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await apiJson('/logout', 'POST', {});
  location.href = '/soruto/admin-login.html';
});
document.getElementById('stepupPwBtn').addEventListener('click', async () => {
  const pw = document.getElementById('stepupPw').value;
  const { status, json } = await apiJson('/stepup/password', 'POST', { password: pw });
  if (status === 200) {
    document.getElementById('stepupPw').value = '';
    runPending();
  } else if (status === 503) {
    setMsg(stepupMsg, 'パスワード未設定のため、パスワード再認証は使えません', true);
  } else {
    setMsg(stepupMsg, (json && json.message) || '再認証に失敗しました', true);
  }
});
document.getElementById('stepupPkBtn').addEventListener('click', async () => {
  try {
    const opt = await apiJson('/stepup/passkey/options', 'POST', {});
    if (opt.status !== 200) { setMsg(stepupMsg, 'パスキーが登録されていません', true); return; }
    const cred = await navigator.credentials.get({ publicKey: prepareRequestOptions(opt.json) });
    if (!cred) return;
    const ver = await apiJson('/stepup/passkey/verify', 'POST', { response: serializeCredential(cred) });
    if (ver.status === 200) runPending();
    else setMsg(stepupMsg, (ver.json && ver.json.message) || '再認証に失敗しました', true);
  } catch (e) {
    setMsg(stepupMsg, '再認証に失敗しました', true);
  }
});
loadAuthInfo();
</script>
</body>
</html>
