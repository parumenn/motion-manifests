# agent-bridge 公開用マニフェスト
# 実体: parumenn-server ホスト上の systemd サービス agent-bridge (port 8737)
# Endpoints でホストIPへ直接向け、F5 Ingress で bridge.parumenn.com を受ける
apiVersion: v1
kind: Service
metadata:
  name: agent-bridge-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8737
---
apiVersion: v1
kind: Endpoints
metadata:
  name: agent-bridge-svc
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.0.64
    ports:
      - port: 8737
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-bridge-ingress
  namespace: default
spec:
  ingressClassName: nginx-f5
  rules:
    - host: bridge.parumenn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-bridge-svc
                port:
                  number: 80
