# agent-bridge 公開用マニフェスト
# 実体: parumenn-server ホスト上の systemd サービス agent-bridge (192.168.0.64:8737)
# Endpoints 直結は ArgoCD に取り込まれなかったため、link サイトと同方式の
# クラスタ内 nginx プロキシ (Deployment) を挟んで Service 化し、F5 Ingress で受ける
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-bridge-nginx-conf
  namespace: default
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      location / {
        proxy_pass http://192.168.0.64:8737;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-bridge-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-bridge-proxy
  template:
    metadata:
      labels:
        app: agent-bridge-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
            requests:
              memory: "32Mi"
              cpu: "25m"
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: conf
          configMap:
            name: agent-bridge-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: agent-bridge-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: agent-bridge-proxy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-bridge-ingress
  namespace: default
spec:
  ingressClassName: nginx-f5
  rules:
    - host: bridge.parumenn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-bridge-svc
                port:
                  number: 80
