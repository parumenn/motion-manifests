apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: motion-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: motion.parumenn.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: motion-backend-svc # ← 名前を合わせる
            port:
              number: 3000
      - path: /uploads
        pathType: Prefix
        backend:
          service:
            name: motion-backend-svc
            port:
              number: 3000
      - path: /images
        pathType: Prefix
        backend:
          service:
            name: motion-backend-svc
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: motion-app
            port:
              number: 80
