apiVersion: v1
kind: PersistentVolume
metadata:
  name: motion-backend-images-pv
spec:
  storageClassName: "motion-main-storage"
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/motion/uploads
    type: DirectoryOrCreate
