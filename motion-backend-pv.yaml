apiVersion: v1
kind: PersistentVolume
metadata:
  name: motion-backend-images-pv
spec:
  storageClassName: "MotionMainStorage" # ← 追加（空文字を指定して動的作成を回避）
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/motion/uploads
    type: DirectoryOrCreate
